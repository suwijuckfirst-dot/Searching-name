        // ฟังก์ชันลบคำนำหน้าชื่อเพื่อเพิ่มความสะดวกในการค้นหา
        function cleanName(name) {
            return name.replace(/^(นาย|นางสาว|นาง|น\.ส\.|ด\.ช\.|ด\.ญ\.)\s*/, '').trim();
        }

        // โหลดข้อมูลลงตารางเมื่อเปิดหน้าเว็บ
        function displayData(data) {
            const tableBody = document.getElementById("tableBody");
            const recordCount = document.getElementById("recordCount");
            tableBody.innerHTML = "";

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="no-result">ไม่พบข้อมูลที่ค้นหา</td></tr>`;
                recordCount.innerText = "พบข้อมูล 0 รายการ";
                return;
            }

            recordCount.innerText = `แสดงผล ${data.length} รายการ`;

            data.forEach(row => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${row.id}</td>
                    <td>${row.name}</td>
                    <td>${row.dept}</td>
                    <td>${row.type}</td>
                    <td>${row.plate}</td>
                    <td>${row.sticker}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // ฟังก์ชันการค้นหา
        function searchData() {
            const keyword = document.getElementById("searchInput").value.toLowerCase().trim();

            if (!keyword) {
                displayData(rawData);
                return;
            }

            const filteredData = rawData.filter(item => {
                const fullName = item.name.toLowerCase();
                const cleanedName = cleanName(item.name).toLowerCase();
                const plate = item.plate.toLowerCase();
                const sticker = item.sticker.toLowerCase();

                // ค้นหาได้ทั้งชื่อเต็ม, ชื่อตัดคำนำหน้า, เลขทะเบียน, หรือเลขสติกเกอร์
                return fullName.includes(keyword) || 
                       cleanedName.includes(keyword) || 
                       plate.includes(keyword) || 
                       sticker.includes(keyword);
            });

            displayData(filteredData);
        }

        // เริ่มแสดงข้อมูลทั้งหมดตอนเปิดหน้าเว็บ
        window.onload = () => displayData(rawData);
    </script>
